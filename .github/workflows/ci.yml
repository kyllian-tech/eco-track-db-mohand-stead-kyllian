name: ECOTRACK CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/ecotrack-api
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint-audit:
    name: Audit dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  lint-eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint src/ --max-warnings 0

  # ── Tests ───────────────────────────────────────────────────────────────────
  test-unit:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Upload résultats tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: coverage/
          retention-days: 7

  test-mutation:
    name: Tests de mutation (Stryker)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx stryker run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 7

  # ── Sécurité ────────────────────────────────────────────────────────────────
  security-sast:
    name: Analyse SAST (Semgrep)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/javascript
          generateSarif: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep.sarif
          retention-days: 30

  test-e2e:
    name: Tests E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [test-unit]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Démarrer l'API
        run: |
          node src/server.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health/live && break
            sleep 1
          done
        env:
          PORT: 3000
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-not-for-prod
          JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-prod
      - name: Lancer les tests Playwright
        run: npx playwright test -c tests/e2e/playwright.config.js --project=chromium
        env:
          BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: reports/playwright/
          retention-days: 7

  test-load:
    name: Test de charge (k6 smoke)
    runs-on: ubuntu-latest
    needs: [test-unit]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Démarrer l'API
        run: |
          node src/server.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health/live && break
            sleep 1
          done
        env:
          PORT: 3000
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-not-for-prod
          JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-prod
      - name: k6 smoke test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/load/k6-smoke.js
        env:
          BASE_URL: http://localhost:3000

  security-dependency-scan:
    name: Scan dépendances (Trivy)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: 0

  # ── Build Docker ─────────────────────────────────────────────────────────────
  build-docker:
    name: Build image Docker
    runs-on: ubuntu-latest
    needs: [lint-audit, lint-eslint, test-unit, security-dependency-scan]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./front-end
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/ecotrack-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/ecotrack-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-container-scan:
    name: Scan image Docker (Trivy)
    runs-on: ubuntu-latest
    needs: [build-docker]
    continue-on-error: true
    steps:
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1

  # ── Deploy staging (manuel via workflow_dispatch) ─────────────────────────────
  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    environment:
      name: staging
      url: https://api.staging.ecotrack.com
    continue-on-error: true
    steps:
      - name: Deploy sur staging
        run: |
          echo "Deploy ${{ env.IMAGE_NAME }}:${{ github.sha }} → staging"
          echo "Configure KUBE_CONFIG_STAGING dans les secrets GitHub pour activer le déploiement réel."

  # ── Production (déclenchement manuel) ────────────────────────────────────────
  deploy-production:
    name: Deploy production (manuel)
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.ecotrack.com
    continue-on-error: true
    steps:
      - name: Deploy en production
        run: |
          echo "Deploy ${{ env.IMAGE_NAME }}:${{ github.sha }} → production"
          echo "Configure KUBE_CONFIG_PROD dans les secrets GitHub pour activer le déploiement réel."
