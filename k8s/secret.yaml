# NOTE: In production, use Sealed Secrets or HashiCorp Vault instead of plain Secrets.
# This file is a template only — never commit real secrets to Git.
# See M4.8 (infrastructure/vault/) for the Vault-based secrets management approach.
apiVersion: v1
kind: Secret
metadata:
  name: ecotrack-api-secrets
  namespace: ecotrack-prod
  annotations:
    # Managed by External Secrets Operator — do not edit manually
    externalsecrets.io/managed: "true"
type: Opaque
stringData:
  JWT_SECRET: REPLACE_WITH_VAULT_SECRET
  JWT_REFRESH_SECRET: REPLACE_WITH_VAULT_SECRET
  SUPABASE_URL: REPLACE_WITH_VAULT_SECRET
  SUPABASE_SERVICE_ROLE_KEY: REPLACE_WITH_VAULT_SECRET
  REDIS_URL: REPLACE_WITH_VAULT_SECRET
  SENTRY_DSN: REPLACE_WITH_VAULT_SECRET
