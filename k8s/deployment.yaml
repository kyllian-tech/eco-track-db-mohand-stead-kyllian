    matchLabels:
      app: ecotrack-api
      color: green
  template:
    metadata:
      labels:
        app: ecotrack-api
        color: green
    spec:
      serviceAccountName: ecotrack-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: ecotrack-api
          image: registry.gitlab.com/ecotrack/ecotrack-api:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: ecotrack-api-config
            - secretRef:
                name: ecotrack-api-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health/live
