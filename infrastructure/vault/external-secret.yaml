# M4.8 — External Secrets Operator: Vault → K8s Secrets
# Syncs secrets from HashiCorp Vault into Kubernetes Secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ecotrack-api-secrets
  namespace: ecotrack-prod
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ecotrack-api-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/data/ecotrack/api/jwt
        property: secret
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: secret/data/ecotrack/api/jwt
        property: refresh_secret
    - secretKey: SUPABASE_URL
      remoteRef:
        key: secret/data/ecotrack/api/supabase
        property: url
    - secretKey: SUPABASE_SERVICE_ROLE_KEY
      remoteRef:
        key: secret/data/ecotrack/api/supabase
        property: service_role_key
    - secretKey: REDIS_URL
      remoteRef:
        key: secret/data/ecotrack/api/redis
        property: url
    - secretKey: SENTRY_DSN
      remoteRef:
        key: secret/data/ecotrack/api/monitoring
        property: sentry_dsn
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "https://vault.ecotrack.com"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "ecotrack-api"
